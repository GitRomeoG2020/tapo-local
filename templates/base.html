<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <title>{{ title }} · H500</title>
  <script>
    try {
      if (localStorage.getItem("h500-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (err) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #ffffff;
      --page: #f8fafc;
      --navy: #0f172a;
      --header: #0f172a;
      --header-muted: #94a3b8;
      --nav: #e2e8f0;
      --hover-ink: #0f172a;
      --blue: #1d4ed8;
      --blue-hover: #1e40af;
      --link: #1d4ed8;
      --link-hover: #1e40af;
      --highlight: #dbeafe;
      --hover-bg: #f8fbff;
      --hover-line: #bfdbfe;
      --thumb: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.04);
      --online: #166534;
      --online-bg: #dcfce7;
      --online-dot: #16a34a;
      --offline: #64748b;
      --offline-bg: #f1f5f9;
      --offline-dot: #94a3b8;
      --bad: #991b1b;
      --bad-bg: #fef2f2;
      --bad-line: #fecaca;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: #334155;
      --paper: #1e293b;
      --page: #0f172a;
      --navy: #020617;
      --header: #020617;
      --header-muted: #94a3b8;
      --nav: #e2e8f0;
      --hover-ink: #f8fafc;
      --blue: #1d4ed8;
      --blue-hover: #2563eb;
      --link: #93c5fd;
      --link-hover: #bfdbfe;
      --highlight: #1e3a5f;
      --hover-bg: #243044;
      --hover-line: #3b82f6;
      --thumb: #334155;
      --shadow: rgba(0, 0, 0, 0.28);
      --online: #86efac;
      --online-bg: #14532d;
      --online-dot: #4ade80;
      --offline: #cbd5e1;
      --offline-bg: #334155;
      --offline-dot: #94a3b8;
      --bad: #fecaca;
      --bad-bg: #450a0a;
      --bad-line: #7f1d1d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.5;
      font-size: 1rem;
    }
    header {
      background: var(--header);
      color: white;
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand a { color: white; text-decoration: none; font-size: 1.15rem; letter-spacing: -0.02em; }
    header p { margin: 0.15rem 0 0; color: var(--header-muted); font-size: 0.9rem; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
    nav a {
      color: var(--nav);
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    nav a:hover { background: var(--highlight); color: var(--hover-ink); }
    nav a[aria-current="page"] { background: var(--blue); color: white; }
    nav a[aria-current="page"]:hover { background: var(--blue-hover); color: white; }
    main { max-width: 68rem; margin: 0 auto; padding: 1.75rem 1.25rem 2.75rem; flex: 1 0 auto; width: 100%; }
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.3rem 1rem;
      border-top: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.2;
    }
    .site-footer img {
      height: 30px;
      width: auto;
      display: block;
    }
    .site-footer a { color: var(--muted); font-weight: 600; text-decoration: none; }
    .site-footer a:hover { color: var(--link); }
    html[data-theme="dark"] .about-brand img {
      background: #f8fafc;
      border-radius: 16px;
    }
    .site-footer a[aria-current="page"] { color: var(--ink); }
    .about-copy { max-width: 40rem; }
    .about-copy p:last-child { margin-bottom: 0; }
    .about-copy h2 { margin-top: 0.6rem; }
    .about-brand { display: flex; align-items: center; gap: 1.15rem; margin-top: 0.35rem; }
    .about-brand img { width: 120px; height: 120px; flex: 0 0 auto; }
    .about-brand h2 { margin: 0 0 0.35rem; }
    .about-brand p:last-child { margin-bottom: 0; }
    h1 {
      font-size: 1.75rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.35rem;
    }
    h2 { font-size: 1.15rem; margin: 1.6rem 0 0.35rem; letter-spacing: -0.02em; }
    p { margin: 0.35rem 0 1rem; }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .muted { color: var(--muted); }
    code {
      font-family: Consolas, ui-monospace, monospace;
      font-size: 0.92em;
      background: var(--highlight);
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
    }
    .error {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-line);
      border-radius: 12px;
      padding: 0.9rem 1rem;
    }
    .empty {
      background: var(--paper);
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.15rem;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin: 0.35rem 0 1.25rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 2px var(--shadow);
    }
    a.card:hover {
      border-color: var(--hover-line);
      background: var(--hover-bg);
      box-shadow: 0 0 0 3px var(--highlight);
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
    .camera-card {
      flex-direction: row;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
    }
    .camera-card:hover {
      border-color: var(--hover-line);
      box-shadow: 0 0 0 3px var(--highlight);
    }
    .thumb-link {
      flex: 0 0 12.5rem;
      display: block;
      border-radius: 8px;
      overflow: hidden;
      background: var(--thumb);
      line-height: 0;
    }
    .thumb {
      display: block;
      width: 12.5rem;
      height: 7rem;
      object-fit: cover;
      background: var(--thumb);
    }
    .thumb-missing { background: var(--thumb); }
    .camera-card .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
      flex: 1;
      text-decoration: none;
      color: inherit;
    }
    .card strong { display: block; font-size: 1.05rem; color: var(--ink); }
    .meta { display: flex; gap: 0.45rem 0.85rem; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.92rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      background: var(--online-bg);
      color: var(--online);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }
    .status::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--online-dot);
    }
    .status.off { background: var(--offline-bg); color: var(--offline); }
    .status.off::before { background: var(--offline-dot); }
    .status.bad { background: var(--bad-bg); color: var(--bad); }
    .status.bad::before { background: var(--bad); }
    .check-detail { margin: 0; }
    .scroll {
      overflow-x: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; min-width: 36rem; }
    th, td { text-align: left; padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    th { font-size: 0.78rem; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: var(--page); }
    td:last-child, th:last-child { text-align: right; }
    td form { margin: 0; }
    button, .button-link {
      font: inherit;
      font-weight: 600;
      background: var(--blue);
      color: white;
      border: 1px solid var(--blue);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      min-height: 2.5rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover, .button-link:hover { background: var(--blue-hover); border-color: var(--blue-hover); color: white; }
    button.secondary {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--line);
    }
    button.secondary:hover { background: var(--highlight); border-color: var(--hover-line); color: var(--hover-ink); }
    button.theme-toggle {
      gap: 0.35rem;
      margin-left: 0.15rem;
      min-height: 2.15rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #334155;
      background: transparent;
      color: #e2e8f0;
      font-size: 0.85rem;
      flex: 0 0 auto;
    }
    button.theme-toggle:hover {
      background: #1e293b;
      border-color: #64748b;
      color: white;
    }
    .theme-icon { display: block; flex: 0 0 auto; }
    .theme-icon-sun { display: none; }
    html[data-theme="dark"] .theme-icon-moon { display: none; }
    html[data-theme="dark"] .theme-icon-sun { display: block; }
    button:disabled { opacity: 0.7; cursor: progress; }
    ul.days { list-style: none; display: flex; flex-wrap: wrap; gap: 0.45rem; padding: 0; margin: 0.5rem 0 0.25rem; }
    ul.days a {
      display: inline-flex;
      align-items: center;
      min-height: 2.4rem;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }
    ul.days a:hover { background: var(--highlight); border-color: var(--hover-line); color: var(--hover-ink); }
    ul.days a[aria-current="page"] { background: var(--blue); border-color: var(--blue); color: white; }
    ul.days a[aria-current="page"]:hover { background: var(--blue-hover); color: white; }
    .day-actions { margin: 0.75rem 0 0.75rem; }
    .notice {
      background: var(--highlight);
      color: var(--ink);
      border: 1px solid var(--hover-line);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin: 0.2rem 0 1rem;
    }
    .back { display: inline-block; margin-bottom: 0.85rem; font-weight: 600; text-decoration: none; }
    .page-actions { margin-top: 0.25rem; }
    a.button-link.secondary {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--line);
    }
    a.button-link.secondary:hover { background: var(--highlight); border-color: var(--hover-line); color: var(--hover-ink); }
    main:has(.multiview) { max-width: 100rem; }
    .multiview {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin: 0.35rem 0 1.25rem;
    }
    .multiview-tile { gap: 0.55rem; }
    .multiview-frame {
      position: relative;
      background: var(--navy);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .multiview-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--navy);
    }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.35rem; }
    .controls label { color: var(--muted); font-size: 0.92rem; display: inline-flex; gap: 0.4rem; align-items: center; }
    .controls input[type="range"] {
      width: 9rem;
      accent-color: var(--blue);
    }
    .controls output { min-width: 2.5rem; color: var(--ink); font-weight: 600; }
    .controls select {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.35rem 0.5rem;
    }
    .pending { color: var(--muted); font-size: 0.92rem; }
    .card.failed { border-color: var(--bad-line); }
    .outlets { display: flex; flex-direction: column; gap: 0.65rem; }
    .outlet {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.7rem;
    }
    .outlet .controls { margin-top: 0; }
    @media (min-width: 700px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .cards.camera-list { grid-template-columns: 1fr; }
      .multiview { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1100px) {
      .multiview { grid-template-columns: 1fr 1fr 1fr; }
    }
    @media (min-width: 1500px) {
      .multiview { grid-template-columns: 1fr 1fr 1fr 1fr; }
    }
    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }
      nav { width: 100%; }
      nav a { flex: 1 1 auto; text-align: center; }
      main { padding: 1.15rem 0.9rem 2rem; }
      h1 { font-size: 1.45rem; }
      .camera-card { flex-direction: column; align-items: stretch; }
      .thumb-link, .thumb { width: 100%; flex-basis: auto; height: auto; }
      .thumb { aspect-ratio: 16 / 9; }
      .about-brand { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a href="/"><strong>H500</strong></a>
      <p>Local cameras and hub recordings</p>
    </div>
    {% set path = request.url.path %}
    <nav aria-label="Primary">
      <a href="/"{% if path == "/" or path.startswith("/devices") %} aria-current="page"{% endif %}>Cameras &amp; Recordings</a>
      <a href="/live"{% if path == "/live" %} aria-current="page"{% endif %}>Live View</a>
      <a href="/live/multi"{% if path == "/live/multi" %} aria-current="page"{% endif %}>Multi-view</a>
      <a href="/controls"{% if path == "/controls" %} aria-current="page"{% endif %}>Devices</a>
      <a href="/status"{% if path == "/status" %} aria-current="page"{% endif %}>Status</a>
      <a href="/about"{% if path == "/about" %} aria-current="page"{% endif %}>About</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.8 4.8l1.6 1.6M17.6 17.6l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.8 19.2l1.6-1.6M17.6 6.4l1.6-1.6"/>
        </svg>
        <span class="theme-label">Dark</span>
      </button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <img src="/images/logo.svg" alt="G&amp;R" height="30">
    <span>Made in the USA by G&amp;R</span>
    <a href="/about"{% if path == "/about" %} aria-current="page"{% endif %}>About</a>
  </footer>
  <script>
    (function () {
      var key = "h500-theme";
      var root = document.documentElement;
      var button = document.getElementById("theme-toggle");
      var label = button.querySelector(".theme-label");

      function sync() {
        var dark = root.getAttribute("data-theme") === "dark";
        button.setAttribute("aria-pressed", dark ? "true" : "false");
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        label.textContent = dark ? "Light" : "Dark";
      }

      button.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        if (next === "dark") root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");
        try {
          localStorage.setItem(key, next);
        } catch (err) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
