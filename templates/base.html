<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · H500</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5c6778;
      --line: #d8dee8;
      --paper: #ffffff;
      --page: #f3f5f8;
      --accent: #0b57d0;
      --bad: #8d1d1d;
      --bad-bg: #fdecec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: #1f2933;
      color: white;
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
    }
    header a { color: white; text-decoration: none; }
    header p { margin: 0.2rem 0 0; color: #c5ced8; font-size: 0.92rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    nav a { padding: 0.35rem 0.65rem; border-radius: 6px; }
    nav a:hover { background: rgba(255, 255, 255, 0.1); }
    nav a[aria-current="page"] { background: rgba(255, 255, 255, 0.16); font-weight: 600; }
    main { max-width: 52rem; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.45rem; margin: 0 0 0.8rem; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .error {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid #f0c2c2;
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }
    .card {
      display: block;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.7rem;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { border-color: var(--accent); }
    .card strong { display: block; font-size: 1.05rem; }
    .meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .scroll { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 36rem; }
    th, td { text-align: left; padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    button {
      font: inherit;
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    ul.days { padding-left: 1.2rem; }
    ul.days a[aria-current="page"] { font-weight: 700; }
    .day-actions { margin: 0.2rem 0 1rem; }
    .day-actions button:disabled { opacity: 0.75; cursor: progress; }
    .notice {
      background: #e8f0fe;
      border: 1px solid #c5d7f7;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin: 0.2rem 0 1rem;
    }
    .back { display: inline-block; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="/"><strong>H500</strong></a>
      <p>Local cameras and hub recordings</p>
    </div>
    {% set path = request.url.path %}
    <nav aria-label="Primary">
      <a href="/"{% if path == "/" or path.startswith("/devices") %} aria-current="page"{% endif %}>Cameras &amp; Recordings</a>
      <a href="/live"{% if path == "/live" %} aria-current="page"{% endif %}>Live View</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
